name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/test.mjs
      - run: python3 scripts/plan.py --hours 48 --json-brief
      - run: python3 scripts/check.py --json '{}' --json-brief
